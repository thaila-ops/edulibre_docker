name: EduLivre CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EduLibre_BackEnd-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: EduLibre_BackEnd-main/package-lock.json }
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EduLibre_FrontEnd-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: EduLibre_FrontEnd-main/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  payment-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pagamento-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: pagamento-service/package-lock.json }
      - run: npm ci
      - run: npm test -- --passWithNoTests
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
