name: EduLivre CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EduLibre_BackEnd-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: EduLibre_BackEnd-main/package-lock.json }
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EduLibre_FrontEnd-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: EduLibre_FrontEnd-main/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  payment-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pagamento-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: pagamento-service/package-lock.json }
      - run: npm ci
      - run: npm test -- --passWithNoTests
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create environment for Compose validation
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci-root-password
          MYSQL_DATABASE=edulivre
          MYSQL_USER=app
          MYSQL_PASSWORD=ci-app-password
          DB_HOST=database
          DB_NAME=edulivre
          DB_USER=app
          DB_PASS=ci-app-password
          MEDIA_INTERNAL_API_KEY=ci-internal-media-key
          EOF
      - run: docker compose config --quiet

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, payment-service, compose]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Docker host over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Configure DEPLOY_HOST in the production environment}"
          : "${DEPLOY_USER:?Configure DEPLOY_USER in the production environment}"
          : "${DEPLOY_PATH:?Configure DEPLOY_PATH in the production environment}"
          : "${DEPLOY_SSH_KEY:?Configure DEPLOY_SSH_KEY in the production environment}"
          : "${DEPLOY_KNOWN_HOSTS:?Configure DEPLOY_KNOWN_HOSTS in the production environment}"

          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "DEPLOY_HOST must be a DNS name or IPv4 address" >&2; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "DEPLOY_USER contains unsupported characters" >&2; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]] || { echo "DEPLOY_PATH must be an absolute path without spaces" >&2; exit 1; }

          key_file="$RUNNER_TEMP/edulibre-deploy-key"
          known_hosts_file="$RUNNER_TEMP/edulibre-known-hosts"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"

          ssh -i "$key_file" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$DEPLOY_PATH'" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          git -C "$deploy_path" switch main
          git -C "$deploy_path" pull --ff-only origin main
          docker compose -f "$deploy_path/docker-compose.yml" -p proj up -d --build
          docker compose -f "$deploy_path/docker-compose.yml" -p proj ps
          REMOTE
