services:
  database:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql  
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "mysql", "-u", "app", "-p123456", "-e", "SELECT 1 FROM information_schema.schemata WHERE schema_name='edulivre'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./EduLibre_BackEnd-main
      dockerfile: Dockerfile
    container_name: backend_service
    restart: always
    env_file: .env
    environment:
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-edulivre}
      DB_USER: ${DB_USER:-app}
      DB_PASS: ${DB_PASS}
   
    networks:
      - internal_network
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./EduLibre_FrontEnd-main
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: https://edulibre.local/api
    container_name: frontend_service
    restart: "no"
    volumes:
      - frontend_build:/usr/share/nginx/html
    networks:
      - internal_network
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro      
      - frontend_build:/usr/share/nginx/html:ro
    networks:
      - internal_network
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  frontend_build:

networks:
  internal_network:
    driver: bridge